<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Bhumika Mittal</title>
<meta name="description" content="Page not found.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/theme.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap">
<style>
  main.lost-page { max-width: 1000px; padding-top: 64px; }
  .lost-head { text-align: center; margin-bottom: 44px; }
  .lost-head .page-title { margin-bottom: 8px; }
  .lost-head p { color: var(--ink-soft); }
  .lost-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 56px;
    align-items: center;
  }
  .poem { text-align: center; }
  .poem-urdu {
    font-family: 'Noto Nastaliq Urdu', serif;
    font-size: 1.35rem;
    line-height: 2.3;
    direction: rtl;
    margin-bottom: 14px;
  }
  .poem-translit { font-style: italic; color: var(--ink-soft); line-height: 1.9; }
  .poem-author { color: var(--ink-soft); font-size: 0.92rem; margin-top: 10px; }
  .lost-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 32px;
  }
  .lost-actions a {
    padding: 8px 18px;
    border: 1px solid var(--rule);
    color: var(--ink);
    text-decoration: none;
    font-size: 0.92rem;
  }
  .lost-actions a:hover { border-color: var(--ink-faint); }
  .lost-art { margin: 0; text-align: center; }
  .lost-art img { max-height: 420px; width: auto; margin: 0 auto; }
  .lost-art figcaption {
    margin-top: 10px;
    color: var(--ink-faint);
    font-size: 0.88rem;
    font-style: italic;
  }
  @media (max-width: 760px) {
    .lost-grid { grid-template-columns: 1fr; gap: 32px; }
    .lost-art { order: -1; }
    .lost-art img { max-height: 300px; }
  }
</style>
</head>
<body>


<main class="lost-page">
  <div class="lost-head">
    <h1 class="page-title">Error 404</h1>
    <p>This page seems to have been lost, much like this lost artwork.</p>
  </div>

  <div class="lost-grid">
    <div>
      <div class="poem">
        <div id="poem-urdu" class="poem-urdu"></div>
        <div id="poem-translit" class="poem-translit"></div>
        <div id="poem-author" class="poem-author"></div>
      </div>
      <div class="lost-actions">
        <a id="report-link" href="mailto:bhumikamittal@gatech.edu">Report a broken link</a>
        <a href="/">Return to home</a>
      </div>
    </div>
    <figure class="lost-art">
      <img id="lost-art" alt="">
      <figcaption id="lost-caption"></figcaption>
    </figure>
  </div>
</main>

<script>
  (function () {
    var art = [
      ['1070px-Vermeer_The_concert.jpeg', 'The Concert by Johannes Vermeer'],
      ['1570px-Rembrandt_Harmensz._van_Rijn_076.jpg', 'Portrait of a Young Man by Rembrandt'],
      ['Caravaggio_005.jpg', 'Nativity with St. Francis and St. Lawrence by Caravaggio'],
      ['\u00c9douard_Manet_Chez_Tortoni.jpg', 'Chez Tortoni by \u00c9douard Manet'],
      ['Raphael_missing.jpg', 'Portrait of a Young Man by Raphael'],
      ['Rembrandt_Christ_in_the_Storm_on_the_Lake_of_Galilee.jpg', 'Christ in the Storm on the Lake of Galilee by Rembrandt'],
      ['Van_Gogh_-_Vase_mit_Pechnelken.jpeg', 'Vase with Lychnis by Vincent van Gogh'],
      ['View_of_Auvers-sur-Oise_Paul_Cezanne.png', 'View of Auvers-sur-Oise by Paul C\u00e9zanne']
    ];
    var pick = art[Math.floor(Math.random() * art.length)];
    var img = document.getElementById('lost-art');
    img.src = '/assets/img/lost/' + encodeURIComponent(pick[0]);
    img.alt = pick[1];
    document.getElementById('lost-caption').textContent = pick[1];

    var subject = encodeURIComponent('Broken link on your website');
    var body = encodeURIComponent('Hi Bhumika,\n\nThis link on your website is broken: ' + window.location.href);
    document.getElementById('report-link').href = 'mailto:bhumikamittal@gatech.edu?subject=' + subject + '&body=' + body;

    function show(urdu, translit, author) {
      document.getElementById('poem-urdu').innerHTML = urdu.join('<br>');
      document.getElementById('poem-translit').innerHTML = translit.join('<br>');
      document.getElementById('poem-author').textContent = author;
    }

    fetch('/assets/data/poems.txt')
      .then(function (r) { return r.text(); })
      .then(function (text) {
        var poems = text.split('---').map(function (p) { return p.trim(); }).filter(Boolean);
        var lines = poems[Math.floor(Math.random() * poems.length)].split('\n');
        var urdu = [], translit = [], author = '', section = '';
        lines.forEach(function (line) {
          line = line.trim();
          if (!line) return;
          if (line.indexOf('URDU:') === 0) { section = 'urdu'; line = line.slice(5).trim(); }
          else if (line.indexOf('TRANSLIT:') === 0) { section = 'translit'; line = line.slice(9).trim(); }
          else if (line.indexOf('AUTHOR:') === 0) { author = line.slice(7).trim(); return; }
          if (!line) return;
          if (section === 'urdu') urdu.push(line);
          else if (section === 'translit') translit.push(line);
        });
        show(urdu, translit, author);
      })
      .catch(function () {
        show(['\u0633\u0631\u0641 \u0627\u06a9 \u0642\u062f\u0645 \u0627\u0679\u06be\u0627 \u062a\u06be\u0627 \u063a\u0644\u0637 \u0631\u0627\u06c1 \u0634\u0648\u0642 \u0645\u06cc\u06ba',
              '\u0645\u0646\u0632\u0644 \u062a\u0645\u0627\u0645 \u0639\u0645\u0631 \u0645\u062c\u06be\u06d2 \u0688\u06be\u0648\u0646\u0688\u062a\u06cc \u0631\u06c1\u06cc'],
             ['sirf ek qadam utha tha ghalat rah-e-shauq men', 'manzil tamam umr mujhe dhundhti rahi'],
             '- Abdul Hamid Adam');
      });
  })();
</script>

</body>
</html>
